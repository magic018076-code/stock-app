name: App 功能總檢查

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝無頭瀏覽器
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: 逐一檢查每個功能
        run: node scripts/check_app.js

      - name: 寫入摘要
        if: always()
        run: cat check-out/report.md >> $GITHUB_STEP_SUMMARY || true

      - name: 上傳報告與截圖
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: check-out/
