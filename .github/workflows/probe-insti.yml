name: probe-insti
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in 2017/03/02 2016/08/18 2018/01/15 2018/06/01 2014/05/02; do
            echo "=== $d"
            curl -s -A "Mozilla/5.0 (Linux; Android 14) Chrome/130" "https://www.tpex.org.tw/www/zh-tw/insti/dailyTrade?type=Daily&sect=EW&date=$d&response=json" | python3 -c "
          import json,sys
          j=json.load(sys.stdin); print({k:(v if not isinstance(v,(list,dict)) else type(v).__name__) for k,v in j.items()})
          for t in j.get('tables') or []:
              d=t.get('data',[]); print('title',t.get('title'),'n',len(d),'fields',t.get('fields'))
              for r in d[:2]: print(len(r), r)
          "
            sleep 3
          done
