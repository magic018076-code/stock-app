name: 編譯 Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安裝套件並同步網頁到 Android
        run: |
          npm ci
          npx cap sync android

      - name: 編譯 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../stock-app.apk
          VC=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          VN=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          echo "{\"versionCode\":$VC,\"versionName\":\"$VN\"}" > ../version.json
          echo "VN=$VN" >> $GITHUB_ENV

      - name: 發佈到 Releases（手機直接下載）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 股市智多星 最新版
          body: 版本 ${{ env.VN }}。用 Android 手機下載「stock-app.apk」安裝；之後可在 App 內「個人 → 檢查更新」更新。
          files: |
            stock-app.apk
            version.json
          make_latest: true
