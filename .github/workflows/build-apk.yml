name: 編譯 Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 安裝套件並同步網頁到 Android
        run: |
          npm ci
          npx cap sync android

      - name: 編譯 APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../上櫃家數.apk

      - name: 發佈到 Releases（手機直接下載）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 上櫃家數 App 最新版
          body: 用 Android 手機打開這頁，下載下方的「上櫃家數.apk」安裝。
          files: 上櫃家數.apk
          make_latest: true
