name: 檢查除權息資料來源

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 測試除權息網址
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36"
          for u in \
            "https://www.twse.com.tw/rwd/zh/exRight/TWT49U?startDate=20250601&endDate=20250731&response=json" \
            "https://www.twse.com.tw/rwd/zh/exRight/TWT49U?startDate=20160101&endDate=20161231&response=json" \
            "https://www.twse.com.tw/rwd/zh/reducation/TWTAUU?startDate=20250101&endDate=20251231&response=json" \
            "https://www.tpex.org.tw/www/zh-tw/bulletin/exDailyQ?startDate=2025/06/01&endDate=2025/07/31&response=json" \
            "https://www.tpex.org.tw/web/stock/exright/dailyquo/exDailyQ_result.php?l=zh-tw&d=114/06/01&ed=114/07/31&o=json" \
            "https://www.tpex.org.tw/www/zh-tw/bulletin/exDailyQ?date=2025/07/01&response=json" ; do
            echo "=== $u"
            curl -sS -A "$UA" -m 40 -o /tmp/r -w "HTTP %{http_code}  大小 %{size_download}\n" "$u" || echo 失敗
            python3 -c "
          import json,sys
          try:
              j=json.load(open('/tmp/r'))
          except Exception as e:
              print('非 JSON',open('/tmp/r','rb').read(200));sys.exit()
          t=j.get('tables') or [j]
          for x in t[:1]:
              print('stat',j.get('stat'),'fields',x.get('fields')); d=x.get('data') or x.get('aaData') or []; print('筆數',len(d)); print(d[:2])
          "
            sleep 3
          done
