name: 檢查歷史營收來源

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 看 CSV 內容
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36"
          for f in "sii/&fileName=t21sc03_115_9.csv" "otc/&fileName=t21sc03_115_9.csv" "sii/&fileName=t21sc03_105_1.csv" "otc/&fileName=t21sc03_105_1.csv"; do
            echo "=== $f"
            curl -sS -A "$UA" -m 40 -o /tmp/r "https://mopsov.twse.com.tw/server-java/FileDownLoad?step=9&functionName=show_file2&filePath=%2Ft21%2F${f}"
            wc -l < /tmp/r; head -3 /tmp/r; grep -m1 '"2330"\|,2330,' /tmp/r; grep -m1 '"6488"\|,6488,' /tmp/r
            sleep 2
          done
