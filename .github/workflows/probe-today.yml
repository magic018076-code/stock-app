name: probe-today
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "Mozilla/5.0 (Linux; Android 14) Chrome/130" "https://www.twse.com.tw/rwd/zh/TAIEX/MI_5MINS_INDEX?date=20261118&response=json" | python3 -c "
          import json,sys
          j=json.load(sys.stdin); print('stat',j.get('stat'),j.get('fields',[])[:2])
          d=j.get('data',[])
          for r in d[::12]: print('I',r[0],r[1])
          if d: print('I',d[-1][0],d[-1][1])
          "
