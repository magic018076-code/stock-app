name: probe-today
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) Chrome/130"
          for u in "https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date=20261120&selectType=ALL&response=json" \
                   "https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN?date=20080115&selectType=ALL&response=json" \
                   "https://www.tpex.org.tw/www/zh-tw/margin/balance?date=2026/11/20&response=json" \
                   "https://www.tpex.org.tw/www/zh-tw/margin/balance?date=2012/05/02&response=json" \
                   "https://www.tpex.org.tw/www/zh-tw/margin/balance?date=2008/01/15&response=json"; do
            echo "=== $u"
            curl -s -A "$UA" "$u" | python3 -c "
          import json,sys
          try: j=json.load(sys.stdin)
          except Exception as e: print('notjson',e); sys.exit()
          print({k:(v if not isinstance(v,(list,dict)) else type(v).__name__) for k,v in j.items()})
          for t in j.get('tables') or []:
              d=t.get('data',[]); print('T',t.get('title'),'n',len(d),'fields',t.get('fields'))
              for r in d[:2]: print('R',len(r), r)
          "
            sleep 4
          done
