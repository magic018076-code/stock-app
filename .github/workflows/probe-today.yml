name: probe-today
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 14) Chrome/130"
          echo "=== YAHOO2"; curl -s -m 30 -A "$UA" "https://query2.finance.yahoo.com/v8/finance/chart/TWD=X?range=1mo&interval=1d" | head -c 400; echo
          echo "=== BOT"; curl -s -m 30 -A "$UA" "https://rate.bot.com.tw/xrt/flcsv/0/day" | head -3
          echo "=== BOTHIST"; curl -s -m 30 -A "$UA" "https://rate.bot.com.tw/xrt/flcsv/0/2026-11-19" | head -3
          echo "=== TAIFEX"; curl -s -m 30 -A "$UA" "https://www.taifex.com.tw/cht/3/dailyFXRateDown" -d "queryStartDate=2026/11/01&queryEndDate=2026/11/20" | iconv -f big5 -t utf8 2>/dev/null | head -5
