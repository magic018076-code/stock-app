name: probe-today
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request, time, json
          for ua in ("curl/8.5.0", "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36"):
              t=time.time()
              try:
                  b=urllib.request.urlopen(urllib.request.Request("https://fred.stlouisfed.org/graph/fredgraph.csv?id=DEXTAUS&cosd=2006-01-01",headers={"User-Agent":ua}),timeout=60).read()
                  print("FRED",ua[:10],len(b),round(time.time()-t,1),b[:60])
              except Exception as e: print("FRED",ua[:10],"ERR",e,round(time.time()-t,1))
          t=time.time()
          try:
              b=urllib.request.urlopen(urllib.request.Request("https://cpx.cbc.gov.tw/API/DataAPI/Get?FileName=BP01D01",headers={"User-Agent":"curl/8.5.0"}),timeout=60).read()
              j=json.loads(b); print("CBC",len(b),round(time.time()-t,1),list(j.keys()))
              ds=j.get("data") or j.get("dataSets") or {}
              print(str(j)[600:1800])
          except Exception as e: print("CBC ERR",e)
          PY
