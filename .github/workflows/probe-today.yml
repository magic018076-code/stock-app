name: probe-today
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 14) Chrome/130"
          echo "=== CBC"; curl -s -m 30 -A "$UA" "https://cpx.cbc.gov.tw/API/DataAPI/Get?FileName=BP01D01" | head -c 600; echo
          echo "=== TAIFEX"; curl -s -m 30 -A "$UA" -X POST "https://www.taifex.com.tw/cht/3/dailyFXRateDown" -d "queryStartDate=2026%2F11%2F01&queryEndDate=2026%2F11%2F20" -o fx.csv; ls -la fx.csv; file fx.csv; python3 -c "print(open('fx.csv','rb').read()[:400].decode('big5','replace'))"
          echo "=== TAIFEXPAGE"; curl -s -m 30 -A "$UA" "https://www.taifex.com.tw/cht/3/dailyFXRate" | python3 -c "import sys,re;t=sys.stdin.read();print(len(t));print(re.findall(r'\d{4}/\d{2}/\d{2}[^\n]{0,200}',t)[:3])"
