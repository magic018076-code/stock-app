name: probe-today
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd scripts && python3 - <<'PY'
          import json, datetime as dt, build_lowbase as b
          d = dt.date(2026, 11, 18)
          out = {}
          for f in (b.fetch_twse, b.fetch_tpex):
              r = f(d) or {}
              print("got", f.__name__, len(r))
              out.update(r)
          for c, v in sorted(out.items()):
              print("Q", c, v[2], v[3], v[4], v[5], v[6])
          PY
