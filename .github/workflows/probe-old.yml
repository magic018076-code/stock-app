name: 檢查舊資料來源

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 測試 2007～2015 年的資料
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36"
          for u in \
            "https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20070105&type=ALLBUT0999&response=json" \
            "https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20081008&type=ALLBUT0999&response=json" \
            "https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=20120105&type=ALLBUT0999&response=json" \
            "https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2007/01/05&id=&response=json" \
            "https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2008/10/08&id=&response=json" \
            "https://www.tpex.org.tw/www/zh-tw/afterTrading/dailyQuotes?date=2012/01/05&id=&response=json" \
            "https://www.twse.com.tw/rwd/zh/exRight/TWT49U?startDate=20080101&endDate=20081231&response=json" \
            "https://www.tpex.org.tw/www/zh-tw/bulletin/exDailyQ?startDate=2008/06/01&endDate=2008/09/30&response=json" \
            "https://www.twse.com.tw/rwd/zh/fund/T86?date=20120502&selectType=ALLBUT0999&response=json" \
            "https://www.twse.com.tw/rwd/zh/fund/T86?date=20150105&selectType=ALLBUT0999&response=json" \
            "https://www.twse.com.tw/rwd/zh/fund/T86?date=20190105&selectType=ALLBUT0999&response=json" \
            "https://www.twse.com.tw/rwd/zh/fund/T86?date=20190107&selectType=ALLBUT0999&response=json" \
            "https://www.tpex.org.tw/www/zh-tw/insti/dailyTrade?type=Daily&sect=EW&date=2012/05/02&response=json" \
            "https://www.tpex.org.tw/www/zh-tw/insti/dailyTrade?type=Daily&sect=EW&date=2015/01/05&response=json" \
            "https://www.tpex.org.tw/www/zh-tw/insti/dailyTrade?type=Daily&sect=EW&date=2019/01/07&response=json" ; do
            echo "=== $u"
            curl -sS -A "$UA" -m 40 -o /tmp/r -w "HTTP %{http_code} 大小 %{size_download}\n" "$u" || echo 失敗
            python3 -c "
          import json,sys
          try: j=json.load(open('/tmp/r'))
          except Exception as e: print('非 JSON',open('/tmp/r','rb').read(150)); sys.exit()
          ts=j.get('tables') or [j]
          print('stat',j.get('stat'),'表數',len(ts))
          for t in ts:
              d=t.get('data') or []
              if len(d)>200 or len(ts)==1:
                  print(' 標題',t.get('title'),'筆數',len(d)); print(' 欄位',t.get('fields')); print(' 例',d[0] if d else None); break
          "
            sleep 3
          done
