<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>股市智多星</title>
<style>
:root{--bg:#000;--bar:#25292f;--hd:#33373e;--sec:#15171b;--line:#2a2c30;--ink:#fff;--mute:#9aa0a8;
  --up:#ff2a2a;--down:#25d925;--flat:#e8e8e8;--acc:#ffb020;--fs:18px}
body.swap{--up:#25d925;--down:#ff2a2a}
body.fs-s{--fs:16px}body.fs-l{--fs:20px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:Roboto,"Noto Sans TC","PingFang TC",sans-serif;font-size:15px;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0}
.app{display:flex;flex-direction:column;height:100%}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.mute{color:var(--mute)}

/* 標題列 */
.tb{display:flex;align-items:center;height:calc(54px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 6px 0;background:var(--bar);flex:none}
.tb .side{width:92px;display:flex;align-items:center;gap:4px}
.tb .side.r{justify-content:flex-end}
.tb .ic{width:44px;height:44px;display:grid;place-items:center}
.tb .ic svg{width:26px;height:26px;stroke:#fff;fill:none;stroke-width:2}
.tb .title{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.25rem;font-weight:500;white-space:nowrap;overflow:hidden}
.tb .title .chev{width:26px;height:26px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;flex:none}
.tb .title .chev svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5}

/* 報價表 */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.qh{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:27% 25% 26% 22%;height:40px;align-items:center;background:var(--hd);font-size:1.05rem}
.qh>span{text-align:right;padding-right:10px;white-space:nowrap}
.qh>span:first-child{text-align:center;padding:0;position:relative}
.qh>span:first-child::before{content:"";position:absolute;left:8px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:8px solid var(--acc)}
.qh .so{display:inline-block;margin-left:2px;font-size:.75rem;color:#fff}
.qr{display:grid;grid-template-columns:27% 25% 26% 22%;height:calc(var(--fs)*2.75);align-items:center;border-bottom:1px solid var(--line);font-size:var(--fs);font-variant-numeric:tabular-nums}
.qr:active{background:#14161a}
.qr>div{text-align:right;padding-right:10px;white-space:nowrap;font-weight:500}
.qr .nm{text-align:center;padding:0 4px;position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center}
.qr .nm b{font-weight:500;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr .nm b.sm{font-size:.82em}
.qr .nm i{position:absolute;bottom:2px;left:16%;right:16%;height:3px;display:flex;font-style:normal}
.qr .nm i s{display:block;height:100%}
.sec{background:var(--sec);color:var(--mute);font-size:.82rem;padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.empty{color:var(--mute);text-align:center;padding:36px 12px;font-size:.92rem}
.foot{color:var(--mute);font-size:.75rem;padding:12px;line-height:1.6}

/* 底部 */
nav{display:flex;background:var(--bar);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);flex:none}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.82rem;color:#e6e6e6}
nav button svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button.on{color:var(--acc)}

/* 一般列表 */
.li{display:flex;align-items:center;gap:12px;padding:15px 14px;border-bottom:1px solid var(--line);font-size:1rem}
.li .l{flex:1;min-width:0}.li .l small{display:block;color:var(--mute);font-size:.78rem;margin-top:3px}
.li .r{color:var(--mute);font-size:.88rem}
.li:active{background:#14161a}
.sw{width:46px;height:26px;border-radius:13px;background:#444;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}.sw.on::after{left:23px}
.opt{display:flex;gap:6px}.opt button{border:1px solid #555;border-radius:6px;padding:4px 10px;font-size:.85rem}.opt button.on{background:var(--acc);border-color:var(--acc);color:#000}
.kv{display:grid;grid-template-columns:1fr 1fr}
.kv div{display:flex;justify-content:space-between;padding:11px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv div:nth-child(odd){border-right:1px solid var(--line)}
.kv span{color:var(--mute)}
.news{padding:12px 14px;border-bottom:1px solid var(--line)}
.news .t{font-size:.98rem;line-height:1.45}
.news .s{color:var(--mute);font-size:.76rem;margin-top:5px;display:flex;justify-content:space-between}
.news .body{display:none;white-space:pre-wrap;font-size:.86rem;color:#ccc;margin-top:8px;line-height:1.55}
.news.open .body{display:block}
.tag{font-size:.7rem;border:1px solid #555;border-radius:4px;padding:0 5px;margin-right:6px;color:var(--mute)}
.btn{display:block;margin:14px auto;background:var(--acc);color:#000;font-weight:700;border-radius:8px;padding:11px 26px;font-size:1rem}
.btn.ghost{background:none;border:1px solid #666;color:#fff;font-weight:400}
input[type=search],input[type=text]{flex:1;background:#1b1d22;border:1px solid #3a3d44;color:#fff;border-radius:8px;padding:10px 12px;font-size:1rem;font-family:inherit;width:100%}
.big{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.big .px{font-size:2.6rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.big .ch{font-size:1.15rem;font-variant-numeric:tabular-nums}
.five{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.five>div{display:grid;grid-template-columns:1fr 1fr;padding:0 10px}
.five>div:first-child{border-right:1px solid var(--line)}
.five p{margin:0;padding:6px 0;font-variant-numeric:tabular-nums;font-size:.95rem}
.five p:nth-child(even){text-align:right}

/* 下拉選單／彈出頁 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none}
.mask.on{display:block}
.sheet{position:absolute;left:0;right:0;top:calc(54px + env(safe-area-inset-top));background:#1d2025;max-height:70%;overflow-y:auto;border-bottom:2px solid var(--acc)}
.sheet button{display:flex;width:100%;padding:15px 18px;border-bottom:1px solid var(--line);font-size:1.05rem;justify-content:space-between}
.sheet button.on{color:var(--acc)}
.sheet .grp{padding:7px 18px;font-size:.78rem;color:var(--mute);background:#15171b}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
.ov.on{display:flex}
.ktab{display:flex;gap:0;border-bottom:1px solid var(--line)}
.ktab button{flex:1;padding:9px 0;font-size:.92rem;color:var(--mute);border-bottom:2px solid transparent}
.ktab button.on{color:var(--acc);border-color:var(--acc)}
.kleg{display:flex;gap:10px;flex-wrap:wrap;padding:6px 10px 0;font-size:.74rem;font-variant-numeric:tabular-nums;min-height:22px}
#kc{display:block;width:100%;touch-action:pan-y}
.form{display:flex;gap:8px;padding:10px 12px;align-items:center;flex-wrap:wrap}
.form input{flex:1 1 0;min-width:0}
.form label{font-size:.85rem;color:var(--mute)}
.form .b{border:1px solid #555;border-radius:8px;padding:9px 12px;font-size:.9rem;flex:none}
.form .b.acc{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700}
.chip{display:inline-block;border:1px solid #555;border-radius:14px;padding:3px 10px;margin:3px;font-size:.82rem}
.alert{position:fixed;left:10px;right:10px;top:calc(60px + env(safe-area-inset-top));z-index:60;background:#3a2d0a;border:1px solid var(--acc);border-radius:10px;padding:12px 14px;display:none;gap:10px;align-items:center;box-shadow:0 6px 24px #000}
.alert.on{display:flex}.alert b{flex:1;font-weight:500;color:#ffd27a}
.hsum{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.hsum div{padding:10px 12px;border-bottom:1px solid var(--line)}
.hsum div:nth-child(odd){border-right:1px solid var(--line)}
.hsum span{display:block;color:var(--mute);font-size:.76rem}
.hsum b{font-size:1.15rem;font-variant-numeric:tabular-nums;font-weight:500}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#333;color:#fff;padding:9px 16px;border-radius:20px;font-size:.9rem;z-index:50;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.upd{display:none;align-items:center;gap:10px;padding:9px 12px;background:#3a2d0a;color:#ffd27a;font-size:.88rem;flex:none}
.upd.on{display:flex}.upd b{flex:1;font-weight:500}
.upd button{background:var(--acc);color:#000;border-radius:6px;padding:5px 10px;font-weight:700}
.ed{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ed .l{flex:1}.ed .l small{color:var(--mute);margin-left:6px}
.ed button{border:1px solid #555;border-radius:6px;padding:5px 9px;font-size:.85rem}
.ed button.del{border-color:#a33;color:#ff6b6b}
</style>
</head>
<body>
<div class="app">
  <div class="tb">
    <div class="side" id="tbL"></div>
    <div class="title" id="tbT"></div>
    <div class="side r" id="tbR"></div>
  </div>
  <div class="upd" id="updBar"><b id="updText">有新版本</b><button id="updGo">立即更新</button><button id="updX" style="background:none;color:#ffd27a">✕</button></div>
  <div class="main" id="main"></div>
  <nav id="nav">
    <button data-t="home"><svg viewBox="0 0 32 32"><path d="M5 15L16 5l11 10"/><path d="M8 13v13h6v-7h4v7h6V13"/></svg>首頁</button>
    <button data-t="watch"><svg viewBox="0 0 32 32"><path d="M12 9h15M12 16h15M12 23h15"/><circle cx="6.5" cy="9" r="1.3"/><circle cx="6.5" cy="16" r="1.3"/><circle cx="6.5" cy="23" r="1.3"/></svg>自選報價</button>
    <button data-t="intl"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><ellipse cx="16" cy="16" rx="5" ry="11"/><path d="M5 16h22M7 10h18M7 22h18"/></svg>國際金融</button>
    <button data-t="add"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><path d="M16 10v12M10 16h12"/></svg>加入自選</button>
    <button data-t="more"><svg viewBox="0 0 32 32"><rect x="6" y="6" width="8" height="8" rx="1"/><rect x="18" y="6" width="8" height="8" rx="1"/><rect x="6" y="18" width="8" height="8" rx="1"/><rect x="18" y="18" width="8" height="8" rx="1"/></svg>更多</button>
  </nav>
</div>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="ov" id="ov">
  <div class="tb"><div class="side"><button class="ic" id="ovBack"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button></div><div class="title" id="ovT"></div><div class="side r" id="ovR"></div></div>
  <div class="main" id="ovBody"></div>
</div>
<div class="toast" id="toast"></div>
<div class="alert" id="alertBox"><b id="alertText"></b><button class="btn" style="margin:0;padding:6px 12px" id="alertOk">知道了</button></div>

<script>
/* ===== 工具 ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const num=v=>{if(v==null)return NaN;const s=String(v).replace(/[,\s+%]/g,"");if(s===""||s==="-"||s==="--"||s==="X")return NaN;return parseFloat(s)};
const tp=()=>new Date(Date.now()+8*3600e3);
const today=()=>tp().toISOString().slice(0,10);
const nowStr=()=>tp().toISOString().slice(5,16).replace("T"," ");
function isTrading(){const t=tp(),d=t.getUTCDay(),m=t.getUTCHours()*60+t.getUTCMinutes();return d>=1&&d<=5&&m>=525&&m<=825}
function isNightOpen(){const t=tp(),d=t.getUTCDay(),m=t.getUTCHours()*60+t.getUTCMinutes();return (m>=900&&d>=1&&d<=5)||(m<300&&d>=2&&d<=6)}
function rocDate(s){s=String(s||"").replace(/\D/g,"");if(s.length===7)s=(+s.slice(0,3)+1911)+s.slice(3);return s.length===8?`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6)}`:""}
const F=(n,d=2)=>isFinite(n)?n.toFixed(d):"—";
const fmtC=(n,d=2)=>isFinite(n)?n.toLocaleString("zh-TW",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
function fmtBig(n){if(!isFinite(n))return"—";if(n>=1e8)return fmtC(n/1e8,1)+"億";if(n>=1e4)return fmtC(n/1e4,1)+"萬";return fmtC(n,0)}
const cls=c=>!isFinite(c)||c===0?"flat":c>0?"up":"down";
const sg=c=>isFinite(c)&&c>0?"+":"";
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800)}
async function getJSON(url){const r=await fetch(url,{headers:{Accept:"application/json"}});if(!r.ok)throw new Error("HTTP "+r.status);let j=await r.json();if(typeof j==="string")j=JSON.parse(j.trim());return j}
async function postJSON(url,body){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error("HTTP "+r.status);let j=await r.json();if(typeof j==="string")j=JSON.parse(j);return j}
function openUrl(u){try{if(window.Capacitor&&Capacitor.Plugins.Browser){Capacitor.Plugins.Browser.open({url:u});return}}catch(e){}window.open(u,"_blank")}
const IND={"01":"水泥","02":"食品","03":"塑膠","04":"紡織纖維","05":"電機機械","06":"電器電纜","08":"玻璃陶瓷","09":"造紙","10":"鋼鐵","11":"橡膠","12":"汽車","14":"建材營造","15":"航運","16":"觀光餐旅","17":"金融保險","18":"貿易百貨","19":"綜合","20":"其他","21":"化學","22":"生技醫療","23":"油電燃氣","24":"半導體","25":"電腦及週邊","26":"光電","27":"通信網路","28":"電子零組件","29":"電子通路","30":"資訊服務","31":"其他電子","32":"文化創意","33":"農業科技","34":"電子商務","35":"綠能環保","36":"數位雲端","37":"運動休閒","38":"居家生活","80":"管理股票","91":"存託憑證"};
const indName=v=>{v=String(v??"").trim();if(!v)return"";return IND[v.padStart(2,"0")]||v};

const UI_V=2; // 介面版本，要和 ota.json 一致
/* ===== 狀態 ===== */
let S=Object.assign({swap:false,auto:true,int:20,fs:"m"},store.get("settings",{}));
let groups=store.get("groups",null);
if(!groups){groups=[{name:"自選股",codes:store.get("watch",["2330","2317","2454","3008"])}]}
let gSel=store.get("gSel","g:0"),iSel=store.get("iSel","us"),sortSt={k:"",d:0};
let daily={},info={},rt={},news=[],mops=[],idx={tse:null,otc:null},fut={day:[],night:[]},us=[],status=store.get("status",{});
const saveS=()=>store.set("settings",S),saveG=()=>store.set("groups",groups);
function mark(k,ok){status[k]={t:nowStr(),ok};store.set("status",status)}
const curGroup=()=>{const m=/^g:(\d+)$/.exec(gSel);return m?groups[+m[1]]||groups[0]:null};
const allWatch=()=>[...new Set(groups.flatMap(g=>g.codes))];

/* ===== 資料 ===== */
async function cached(key,maxAgeH,loader,force){
  const c=store.get("c_"+key,null);
  if(!force&&c&&(Date.now()-c.at)<maxAgeH*3600e3)return c.v;
  try{const v=await loader();store.set("c_"+key,{at:Date.now(),v});mark(key,true);return v}
  catch(e){mark(key,false);if(c)return c.v;throw e}
}
async function loadDaily(force){
  daily=await cached("daily",4,async()=>{
    const [l,o]=await Promise.allSettled([getJSON("https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"),getJSON("https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes")]);
    const out={},ok=x=>/^\d{4}$/.test(x)||/^00\d{2,4}[A-Z]?$/.test(x);let date="";
    if(l.status==="fulfilled")for(const r of l.value){const c=String(r.Code).trim();if(!ok(c))continue;date=r.Date||date;out[c]=[r.Name.trim(),"上市",num(r.ClosingPrice),num(r.Change),num(r.OpeningPrice),num(r.HighestPrice),num(r.LowestPrice),num(r.TradeVolume)/1000,num(r.TradeValue)]}
    if(o.status==="fulfilled")for(const r of o.value){const c=String(r.SecuritiesCompanyCode).trim();if(!ok(c))continue;date=r.Date||date;out[c]=[String(r.CompanyName).trim(),"上櫃",num(r.Close),num(r.Change),num(r.Open),num(r.High),num(r.Low),num(r.TradingShares)/1000,num(r.TransactionAmount)]}
    if(!Object.keys(out).length)throw new Error("no data");
    return {date:rocDate(date),rows:out};
  },force);
}
async function loadInfo(force){
  info=await cached("info",20,async()=>{
    const [l,o]=await Promise.allSettled([getJSON("https://openapi.twse.com.tw/v1/opendata/t187ap03_L"),getJSON("https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O")]);
    const out={};let nl=0,no=0;
    if(l.status==="fulfilled")for(const r of l.value){const c=String(r["公司代號"]).trim();nl++;out[c]=["上市",indName(r["產業別"]),rocDate(r["上市日期"]),r["公司名稱"],r["董事長"],num(r["實收資本額"]),(r["網址"]||"").trim(),r["公司簡稱"]]}
    if(o.status==="fulfilled")for(const r of o.value){const c=String(r.SecuritiesCompanyCode).trim();no++;out[c]=["上櫃",indName(r.SecuritiesIndustryCode),rocDate(r.DateOfListing),r.CompanyName,r.Chairman,num(r["Paidin.Capital.NTDollars"]),(r.WebAddress||"").trim(),r.CompanyAbbreviation]}
    if(!nl&&!no)throw new Error("no data");
    return {rows:out,nl:l.status==="fulfilled"?nl:null,no:o.status==="fulfilled"?no:null};
  },force);
  const h=store.get("otcHist",{});if(info.no){h[today()]=info.no;store.set("otcHist",h)}
}
async function loadNews(force){
  news=await cached("news",0.5,async()=>{
    const j=await getJSON("https://api.cnyes.com/media/api/v1/newslist/category/tw_stock?limit=40");
    return ((j.items&&j.items.data)||[]).map(x=>({id:x.newsId,t:x.title,at:x.publishAt?x.publishAt*1000:0,st:(x.stock||[]).map(String)})).filter(x=>x.t);
  },force);
}
async function loadMops(force){
  mops=await cached("mops",2,async()=>{
    const [l,o]=await Promise.allSettled([getJSON("https://openapi.twse.com.tw/v1/opendata/t187ap04_L"),getJSON("https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap04_O")]);
    const out=[];const g=(r,ks)=>{for(const k of Object.keys(r))for(const t of ks)if(k.trim()===t)return r[k];return""};
    const add=(arr,mkt)=>{for(const r of arr)out.push({c:String(g(r,["公司代號","SecuritiesCompanyCode"])).trim(),n:g(r,["公司名稱","CompanyName"]),d:rocDate(g(r,["發言日期"])),tm:String(g(r,["發言時間"])).padStart(6,"0").replace(/(\d\d)(\d\d)(\d\d)/,"$1:$2"),sub:String(g(r,["主旨"])).replace(/\s*\r?\n\s*/g,""),body:String(g(r,["說明"])).slice(0,1500),m:mkt})};
    if(l.status==="fulfilled")add(l.value,"上市");if(o.status==="fulfilled")add(o.value,"上櫃");
    if(!out.length)throw new Error("no data");
    out.sort((a,b)=>(b.d+b.tm).localeCompare(a.d+a.tm));return out.slice(0,400);
  },force);
}
const exOf=c=>{const m=(info.rows&&info.rows[c]&&info.rows[c][0])||(daily.rows&&daily.rows[c]&&daily.rows[c][1]);return m==="上櫃"?"otc":"tse"};
const split=s=>String(s||"").split("_").filter(x=>x!=="").map(num);
async function loadRT(codes){
  const list=[...new Set(codes)].filter(Boolean);

  for(let i=0;i<keys.length;i+=40){

    for(const m of j.msgArray||[]){

      const bp=split(m.b),bs=split(m.g),ap=split(m.a),as=split(m.f);

}

  const hit=store.get(key,null);

    const d=(j.tables&&j.tables[0]&&j.tables[0].data)||[];
    bars=d.map(r=>[rocDate(r[0]),num(r[3]),num(r[4]),num(r[5]),num(r[6]),num(r[1])]);

async function loadHist(c,months,onPart){
  const t=tp();let y=t.getUTCFullYear(),m=t.getUTCMonth()+1;const list=[];
  for(let i=0;i<months;i++){list.push([y,m]);m--;if(!m){m=12;y--}}
  let all=[];
  for(const [yy,mm] of list){
    try{const r=await loadMonth(c,yy,mm);all=all.concat(r.bars);if(r.net){if(onPart)onPart(merge(all));await sleep(350)}}catch(e){await sleep(500)}
  }
  return merge(all);
  function merge(a){const mp={};for(const b of a)mp[b[0]]=b;return Object.values(mp).sort((x,y)=>x[0].localeCompare(y[0]))}
}
function aggregate(bars,mode){
  if(mode==="d")return bars;
  const out=[];let cur=null,key=null;
  for(const b of bars){
    let k;if(mode==="m")k=b[0].slice(0,7);else{const d=new Date(b[0]+"T00:00:00Z"),w=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-w);k=d.toISOString().slice(0,10)}
    if(k!==key){if(cur)out.push(cur);key=k;cur=[b[0],b[1],b[2],b[3],b[4],b[5]]}
    else{cur[0]=b[0];cur[2]=Math.max(cur[2],b[2]);cur[3]=Math.min(cur[3],b[3]);cur[4]=b[4];cur[5]+=b[5]}
  }
  if(cur)out.push(cur);return out;
}
const ma=(bars,n,i)=>{if(i<n-1)return NaN;let s=0;for(let k=i-n+1;k<=i;k++)s+=bars[k][4];return s/n};

function kChartSVG(bars){
  const W=Math.max(320,Math.min(window.innerWidth||390,820)),H=230,VH=56,PADR=52,n=bars.length;
  if(n<2)return `<div class="empty">K 線讀取中…</div>`;
  const cw=(W-PADR)/n,lo=Math.min(...bars.map(b=>b[3])),hi=Math.max(...bars.map(b=>b[2])),vmax=Math.max(...bars.map(b=>b[5]))||1;
  const y=v=>8+(hi-v)/((hi-lo)||1)*(H-16),vy=v=>H+VH-(v/vmax)*(VH-6);
  let g="";
  for(let i=0;i<n;i++){const b=bars[i],x=i*cw+cw/2,up=b[4]>=b[1],col=up?"var(--up)":"var(--down)",bw=Math.max(1,cw*0.7);
    g+=`<line x1="${x}" x2="${x}" y1="${y(b[2])}" y2="${y(b[3])}" stroke="${col}" stroke-width="1"/><rect x="${x-bw/2}" y="${Math.min(y(b[1]),y(b[4]))}" width="${bw}" height="${Math.max(1,Math.abs(y(b[1])-y(b[4])))}" fill="${col}"/><rect x="${x-bw/2}" y="${vy(b[5])}" width="${bw}" height="${H+VH-vy(b[5])}" fill="${col}" opacity=".7"/>`}
  for(const [nn,col] of [[5,"#f5c542"],[20,"#c77dff"],[60,"#3ba7ff"]]){let d="";for(let i=0;i<n;i++){const v=ma(bars,nn,i);if(isFinite(v))d+=(d?"L":"M")+(i*cw+cw/2).toFixed(1)+","+y(v).toFixed(1)}if(d)g+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="1.2"/>`}
  const lbl=(v,yy)=>`<text x="${W-4}" y="${yy}" fill="#9aa0a8" font-size="11" text-anchor="end">${F(v,v>=1000?0:2)}</text>`;
  g+=`<line x1="0" x2="${W-PADR}" y1="${H}" y2="${H}" stroke="#333"/>`+lbl(hi,16)+lbl((hi+lo)/2,H/2+4)+lbl(lo,H-4)+`<text x="${W-4}" y="${H+14}" fill="#9aa0a8" font-size="10" text-anchor="end">${fmtBig(vmax)}張</text>`;
  const dl=i=>`<text x="${Math.min(Math.max(i*cw+cw/2,22),W-PADR-22)}" y="${H+VH+14}" fill="#9aa0a8" font-size="10" text-anchor="middle">${bars[i][0].slice(kMode==="m"?0:2).replace(/-/g,"/")}</text>`;
  g+=dl(0)+dl(Math.floor(n/2))+dl(n-1);
  g+=`<line id="kx" x1="-10" x2="-10" y1="0" y2="${H+VH}" stroke="#fff" stroke-dasharray="2 3" opacity=".7"/>`;
  return `<svg id="kc" viewBox="0 0 ${W} ${H+VH+18}" data-cw="${cw}" data-w="${W}">${g}</svg>`;
}
function kLegend(bars,i){

  return `<span class="mute">${b[0]}</span><span>開<b class="${cls(b[1]-p)}">${F(b[1],2)}</b></span><span>高<b class="${cls(b[2]-p)}">${F(b[2],2)}</b></span><span>低<b class="${cls(b[3]-p)}">${F(b[3],2)}</b></span><span>收<b class="${c}">${F(b[4],2)}</b></span><span>量 ${fmtC(b[5],0)}</span><span style="color:#f5c542">MA5 ${F(ma(bars,5,i),2)}</span><span style="color:#c77dff">MA20 ${F(ma(bars,20,i),2)}</span><span style="color:#3ba7ff">MA60 ${F(ma(bars,60,i),2)}</span>`;

const PRESET=[["p:vol","成交量排行"],["p:up","漲幅排行"],["p:down","跌幅排行"],["p:otcvol","上櫃成交量排行"],["p:otcup","上櫃漲幅排行"]];
function presetCodes(k){
  const rows=daily.rows||{},pct=c=>{const r=rows[c],y=r[2]-r[3];return y?r[3]/y*100:0};
  let c=Object.keys(rows).filter(x=>/^\d{4}$/.test(x)&&isFinite(rows[x][2]));
  if(k.startsWith("p:otc"))c=c.filter(x=>rows[x][1]==="上櫃");
  if(k.endsWith("vol"))c.sort((a,b)=>(rows[b][7]||0)-(rows[a][7]||0));
  else{c=c.filter(x=>(rows[x][7]||0)>=200);c.sort(k.endsWith("down")?(a,b)=>pct(a)-pct(b):(a,b)=>pct(b)-pct(a))}
  return c.slice(0,50);
}
