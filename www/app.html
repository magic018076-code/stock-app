<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>股市智多星</title>
<style>
:root{--bg:#000;--bar:#25292f;--hd:#33373e;--sec:#15171b;--line:#2a2c30;--ink:#fff;--mute:#9aa0a8;
  --up:#ff2a2a;--down:#25d925;--flat:#e8e8e8;--acc:#ffb020;--fs:16px}
html{font-size:15px}
body.swap{--up:#25d925;--down:#ff2a2a}
html.fs-xs{font-size:13px;--fs:14px}html.fs-s{font-size:14px;--fs:15px}html.fs-l{font-size:17px;--fs:19px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{font-family:Roboto,"Noto Sans TC","PingFang TC",sans-serif;font-size:.94rem;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;background:none;border:0;padding:0}
.app{display:flex;flex-direction:column;height:100%}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.mute{color:var(--mute)}

/* 標題列 */
.tb{display:flex;align-items:center;height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 6px 0;background:var(--bar);flex:none}
.tb .side{width:92px;display:flex;align-items:center;gap:4px}
.tb .side.r{justify-content:flex-end}
.tb .ic{width:44px;height:44px;display:grid;place-items:center}
.tb .ic svg{width:23px;height:23px;stroke:#fff;fill:none;stroke-width:2}
.tb .title{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-size:1.12rem;font-weight:500;white-space:nowrap;overflow:hidden}
.tb .title .chev{width:26px;height:26px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;flex:none}
.tb .title .chev svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2.5}

/* 報價表 */
.main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
.qh{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:27% 25% 26% 22%;height:2.4rem;align-items:center;background:var(--hd);font-size:.95rem}
.qh>span{text-align:right;padding-right:10px;white-space:nowrap}
.qh>span:first-child{text-align:center;padding:0;position:relative}
.qh>span:first-child::before{content:"";position:absolute;left:8px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:8px solid var(--acc)}
.qh .so{display:inline-block;margin-left:2px;font-size:.75rem;color:#fff}
.qr{display:grid;grid-template-columns:27% 25% 26% 22%;height:calc(var(--fs)*2.6);align-items:center;border-bottom:1px solid var(--line);font-size:var(--fs);font-variant-numeric:tabular-nums}
.qr:active{background:#14161a}
.qr>div{text-align:right;padding-right:10px;white-space:nowrap;font-weight:500}
.qr .nm{text-align:center;padding:0 4px;position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center}
.qr .nm b{font-weight:500;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qr .nm b.sm{font-size:.82em}
.qr .nm i{position:absolute;bottom:2px;left:16%;right:16%;height:3px;display:flex;font-style:normal}
.qr .nm i s{display:block;height:100%}
.sec{background:var(--sec);color:var(--mute);font-size:.82rem;padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.empty{color:var(--mute);text-align:center;padding:36px 12px;font-size:.92rem}
.foot{color:var(--mute);font-size:.75rem;padding:12px;line-height:1.6}

/* 底部 */
nav{display:flex;background:var(--bar);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);flex:none}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.78rem;color:#e6e6e6;white-space:nowrap;overflow:hidden}
nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.6}
nav button.on{color:var(--acc)}

/* 一般列表 */
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-size:1rem}
.li .l{flex:1;min-width:0}.li .l small{display:block;color:var(--mute);font-size:.78rem;margin-top:3px}
.li .r{color:var(--mute);font-size:.88rem}
.li:active{background:#14161a}
.sw{width:46px;height:26px;border-radius:13px;background:#444;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)}.sw.on::after{left:23px}
.opt{display:flex;gap:6px}.opt button{border:1px solid #555;border-radius:6px;padding:4px 10px;font-size:.85rem}.opt button.on{background:var(--acc);border-color:var(--acc);color:#000}
.kv{display:grid;grid-template-columns:1fr 1fr}
.kv div{display:flex;justify-content:space-between;padding:11px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.kv div:nth-child(odd){border-right:1px solid var(--line)}
.kv span{color:var(--mute)}
.news{padding:12px 14px;border-bottom:1px solid var(--line)}
.news .t{font-size:.98rem;line-height:1.45}
.news .s{color:var(--mute);font-size:.76rem;margin-top:5px;display:flex;justify-content:space-between}
.news .body{display:none;white-space:pre-wrap;font-size:.86rem;color:#ccc;margin-top:8px;line-height:1.55}
.news.open .body{display:block}
.tag{font-size:.7rem;border:1px solid #555;border-radius:4px;padding:0 5px;margin-right:6px;color:var(--mute)}
.btn{display:block;margin:14px auto;background:var(--acc);color:#000;font-weight:700;border-radius:8px;padding:11px 26px;font-size:1rem}
.btn.ghost{background:none;border:1px solid #666;color:#fff;font-weight:400}
input[type=search],input[type=text]{flex:1;background:#1b1d22;border:1px solid #3a3d44;color:#fff;border-radius:8px;padding:10px 12px;font-size:1rem;font-family:inherit;width:100%}
.big{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.big .px{font-size:2.2rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1}
.big .ch{font-size:1.15rem;font-variant-numeric:tabular-nums}
.five{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.five>div{display:grid;grid-template-columns:1fr 1fr;padding:0 10px}
.five>div:first-child{border-right:1px solid var(--line)}
.five p{margin:0;padding:6px 0;font-variant-numeric:tabular-nums;font-size:.95rem}
.five p:nth-child(even){text-align:right}

/* 下拉選單／彈出頁 */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:none}
.mask.on{display:block}
.sheet{position:absolute;left:0;right:0;top:calc(48px + env(safe-area-inset-top));background:#1d2025;max-height:70%;overflow-y:auto;border-bottom:2px solid var(--acc)}
.sheet button{display:flex;width:100%;padding:15px 18px;border-bottom:1px solid var(--line);font-size:1.05rem;justify-content:space-between}
.sheet button.on{color:var(--acc)}
.sheet .grp{padding:7px 18px;font-size:.78rem;color:var(--mute);background:#15171b}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column}
.ov.on{display:flex}
.ktab{display:flex;gap:0;border-bottom:1px solid var(--line)}
.ktab button{flex:1;padding:9px 0;font-size:.92rem;color:var(--mute);border-bottom:2px solid transparent}
.ktab button.on{color:var(--acc);border-color:var(--acc)}
.kleg{display:flex;gap:10px;flex-wrap:wrap;padding:6px 10px 0;font-size:.74rem;font-variant-numeric:tabular-nums;min-height:22px}
#kc{display:block;width:100%;touch-action:pan-y}
.form{display:flex;gap:8px;padding:10px 12px;align-items:center;flex-wrap:wrap}
.form input{flex:1 1 0;min-width:0}
.form label{font-size:.85rem;color:var(--mute)}
.form .b{border:1px solid #555;border-radius:8px;padding:9px 12px;font-size:.9rem;flex:none}
.form .b.acc{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700}
.lbrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 0}.lbrow>span{color:var(--mute);font-size:.82rem;flex:none}.lbrow .opt{flex-wrap:wrap;justify-content:flex-end}.lbrow .opt button{padding:4px 8px}
.chip{display:inline-block;border:1px solid #555;border-radius:14px;padding:3px 10px;margin:3px;font-size:.82rem}
.alert{position:fixed;left:10px;right:10px;top:calc(60px + env(safe-area-inset-top));z-index:60;background:#3a2d0a;border:1px solid var(--acc);border-radius:10px;padding:12px 14px;display:none;gap:10px;align-items:center;box-shadow:0 6px 24px #000}
.alert.on{display:flex}.alert b{flex:1;font-weight:500;color:#ffd27a}
.hsum{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.hsum div{padding:10px 12px;border-bottom:1px solid var(--line)}
.hsum div:nth-child(odd){border-right:1px solid var(--line)}
.hsum span{display:block;color:var(--mute);font-size:.76rem}
.hsum b{font-size:1.15rem;font-variant-numeric:tabular-nums;font-weight:500}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#333;color:#fff;padding:9px 16px;border-radius:20px;font-size:.9rem;z-index:50;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
.upd{display:none;align-items:center;gap:10px;padding:9px 12px;background:#3a2d0a;color:#ffd27a;font-size:.88rem;flex:none}
.upd.on{display:flex}.upd b{flex:1;font-weight:500}
.upd button{background:var(--acc);color:#000;border-radius:6px;padding:5px 10px;font-weight:700}
.ed{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.ed .l{flex:1}.ed .l small{color:var(--mute);margin-left:6px}
.ed button{border:1px solid #555;border-radius:6px;padding:5px 9px;font-size:.85rem}
.ed button.del{border-color:#a33;color:#ff6b6b}

/* 低檔選股 */
.seg{display:flex;margin:10px 12px 6px;border:1px solid #444;border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:9px 0;font-size:.95rem;color:#ddd}
.seg button+button{border-left:1px solid #444}
.seg button.on{background:var(--acc);color:#000;font-weight:700}
.seg button small{font-size:.75em;margin-left:3px;opacity:.8}
.fbar{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 12px 10px;border-bottom:1px solid var(--line)}
.fbar button{display:flex;flex-direction:column;align-items:flex-start;position:relative;background:#1b1d22;border:1px solid #3a3d44;border-radius:8px;padding:5px 8px;text-align:left;min-width:0}
.fbar button span{font-size:.68rem;color:var(--mute)}
.fbar button b{font-size:.86rem;font-weight:500;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fbar button i{position:absolute;right:6px;bottom:6px;font-style:normal;font-size:.7rem;color:var(--acc)}
.fbar button.rs{align-items:center;justify-content:center;border-style:dashed}
.fbar button.rs b{color:var(--mute)}
.sheet .ttl{padding:12px 18px;font-size:.85rem;color:var(--acc);background:#15171b;border-bottom:1px solid var(--line)}
.lc{padding:9px 12px 8px;border-bottom:1px solid var(--line)}
.lc:active{background:#14161a}
.lc .r1{display:flex;align-items:baseline;gap:8px}
.lc .r1 b{font-size:calc(var(--fs)*1.02);font-weight:500}
.lc .r1 .cd{color:var(--mute);font-size:.8rem}
.lc .r1 .px{margin-left:auto;font-size:calc(var(--fs)*1.02);font-variant-numeric:tabular-nums;font-weight:500}
.lc .r1 .pc{width:70px;text-align:right;font-variant-numeric:tabular-nums;font-size:.95rem}
.lc .r2{display:flex;gap:12px;font-size:.8rem;color:var(--mute);margin-top:5px;font-variant-numeric:tabular-nums}
.lc .r2 em{font-style:normal;color:var(--acc)}
.rng{position:relative;height:8px;margin:9px 0 3px;border-radius:4px;background:linear-gradient(90deg,#1c3a1c,#3a3d44 50%,#4a1c1c)}
.rng i{position:absolute;top:-3px;width:4px;height:14px;margin-left:-2px;border-radius:2px;background:#fff;box-shadow:0 0 0 1px #000}
.rngl{display:flex;justify-content:space-between;font-size:.7rem;color:var(--mute);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tg{font-size:.74rem;border-radius:4px;padding:2px 7px;background:#26282e;color:#bbb}
.tg.hot{background:#5a1414;color:#ffb3b3}.tg.acc{background:#3a2d0a;color:#ffd27a}.tg.blu{background:#10304a;color:#9fd2ff}
.stars{color:var(--acc);letter-spacing:1px;font-size:.8rem}
.radar{display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--line)}
.radar div{padding:12px 6px;text-align:center}
.radar div+div{border-left:1px solid var(--line)}
.radar b{display:block;font-size:1.4rem;font-weight:500;font-variant-numeric:tabular-nums}
.radar span{font-size:.78rem;color:var(--mute)}
.lbx{padding:10px 12px;border-bottom:1px solid var(--line);font-size:.9rem;line-height:1.7}
nav button.pk svg{stroke:var(--acc)}
.mstrip{display:grid;grid-template-columns:1fr 1fr 1fr;background:#111317;border-bottom:1px solid var(--line)}
.mstrip div{padding:9px 6px;text-align:center;font-variant-numeric:tabular-nums}
.mstrip div+div{border-left:1px solid var(--line)}
.mstrip span{display:block;font-size:.76rem;color:var(--mute)}
.mstrip b{display:block;font-size:1.12rem;font-weight:500;margin:2px 0}
.mstrip small{font-size:.72rem}
.rtline{font-size:.72rem;color:var(--mute);text-align:center;padding:4px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;padding:10px 4px}
.grid button{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0 12px}
.grid button:active{background:#15171b;border-radius:12px}
.grid svg{width:58px;height:58px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.grid span{font-size:1.02rem;color:#eee;letter-spacing:1px;white-space:nowrap}
.grid em{position:absolute;top:8px;left:calc(50% + 18px);min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#e8322a;color:#fff;font-style:normal;font-size:.78rem;font-weight:700;display:grid;place-items:center}
.qr>div.lu,.qr>div.ld{align-self:stretch;display:flex;align-items:center;justify-content:flex-end}.qr>div.lu{background:#b30d0d;color:#fff}.qr>div.ld{background:#0f7a0f;color:#fff}
body.swap .qr>div.lu{background:#0f7a0f}body.swap .qr>div.ld{background:#b30d0d}
</style>
</head>
<body>
<div class="app">
  <div class="tb">
    <div class="side" id="tbL"></div>
    <div class="title" id="tbT"></div>
    <div class="side r" id="tbR"></div>
  </div>
  <div class="upd" id="updBar"><b id="updText">有新版本</b><button id="updGo">立即更新</button><button id="updX" style="background:none;color:#ffd27a">✕</button></div>
  <div class="main" id="main"></div>
  <nav id="nav">
    <button data-t="home"><svg viewBox="0 0 32 32"><path d="M5 15L16 5l11 10"/><path d="M8 13v13h6v-7h4v7h6V13"/></svg>首頁</button>
    <button data-t="pick" class="pk"><svg viewBox="0 0 32 32"><path d="M4 24h6l3-3h6l3 3h6"/><path d="M22 19l4-10M22 9h4v4"/></svg>低檔選股</button>
    <button data-t="watch"><svg viewBox="0 0 32 32"><path d="M12 9h15M12 16h15M12 23h15"/><circle cx="6.5" cy="9" r="1.3"/><circle cx="6.5" cy="16" r="1.3"/><circle cx="6.5" cy="23" r="1.3"/></svg>自選報價</button>
    <button data-t="intl"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><ellipse cx="16" cy="16" rx="5" ry="11"/><path d="M5 16h22M7 10h18M7 22h18"/></svg>國際金融</button>
    <button data-t="add"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><path d="M16 10v12M10 16h12"/></svg>加入自選</button>
  </nav>
</div>

<div class="mask" id="mask"><div class="sheet" id="sheet"></div></div>
<div class="ov" id="ov">
  <div class="tb"><div class="side"><button class="ic" id="ovBack"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button></div><div class="title" id="ovT"></div><div class="side r" id="ovR"></div></div>
  <div class="main" id="ovBody"></div>
</div>
<div class="toast" id="toast"></div>
<div class="alert" id="alertBox"><b id="alertText"></b><button class="btn" style="margin:0;padding:6px 12px" id="alertOk">知道了</button></div>

<script>
/* ===== 工具 ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const num=v=>{if(v==null)return NaN;const s=String(v).replace(/[,\s+%]/g,"");if(s===""||s==="-"||s==="--"||s==="X")return NaN;return parseFloat(s)};
const tp=()=>new Date(Date.now()+8*3600e3);
const today=()=>tp().toISOString().slice(0,10);
const nowStr=()=>tp().toISOString().slice(5,16).replace("T"," ");
function isTrading(){const t=tp(),d=t.getUTCDay(),m=t.getUTCHours()*60+t.getUTCMinutes();return d>=1&&d<=5&&m>=525&&m<=825}
function isNightOpen(){const t=tp(),d=t.getUTCDay(),m=t.getUTCHours()*60+t.getUTCMinutes();return (m>=900&&d>=1&&d<=5)||(m<300&&d>=2&&d<=6)}
function rocDate(s){s=String(s||"").replace(/\D/g,"");if(s.length===7)s=(+s.slice(0,3)+1911)+s.slice(3);return s.length===8?`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6)}`:""}
const F=(n,d=2)=>isFinite(n)?n.toFixed(d):"—";
const fmtC=(n,d=2)=>isFinite(n)?n.toLocaleString("zh-TW",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
function fmtBig(n){if(!isFinite(n))return"—";if(n>=1e8)return fmtC(n/1e8,1)+"億";if(n>=1e4)return fmtC(n/1e4,1)+"萬";return fmtC(n,0)}
const cls=c=>!isFinite(c)||c===0?"flat":c>0?"up":"down";
const sg=c=>isFinite(c)&&c>0?"+":"";
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800)}
function withTO(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("逾時")),ms))])}
async function getJSON(url,ms=20000){const r=await withTO(fetch(url,{headers:{Accept:"application/json"}}),ms);if(!r.ok)throw new Error("HTTP "+r.status);let j=await r.json();if(typeof j==="string")j=JSON.parse(j.trim());return j}
async function postJSON(url,body,ms=15000){const r=await withTO(fetch(url,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(body)}),ms);if(!r.ok)throw new Error("HTTP "+r.status);let j=await r.json();if(typeof j==="string")j=JSON.parse(j);return j}
function openUrl(u){try{if(window.Capacitor&&Capacitor.Plugins.Browser){Capacitor.Plugins.Browser.open({url:u});return}}catch(e){}window.open(u,"_blank")}
const IND={"01":"水泥","02":"食品","03":"塑膠","04":"紡織纖維","05":"電機機械","06":"電器電纜","08":"玻璃陶瓷","09":"造紙","10":"鋼鐵","11":"橡膠","12":"汽車","14":"建材營造","15":"航運","16":"觀光餐旅","17":"金融保險","18":"貿易百貨","19":"綜合","20":"其他","21":"化學","22":"生技醫療","23":"油電燃氣","24":"半導體","25":"電腦及週邊","26":"光電","27":"通信網路","28":"電子零組件","29":"電子通路","30":"資訊服務","31":"其他電子","32":"文化創意","33":"農業科技","34":"電子商務","35":"綠能環保","36":"數位雲端","37":"運動休閒","38":"居家生活","80":"管理股票","91":"存託憑證"};
const indName=v=>{v=String(v??"").trim();if(!v)return"";return IND[v.padStart(2,"0")]||v};

const UI_V=16; // 介面版本，要和 ota.json 一致

const inflight={};
function cached(key,maxAgeH,loader,force){
  if(inflight[key])return inflight[key];
  const p=cached0(key,maxAgeH,loader,force);inflight[key]=p;
  const done=()=>{delete inflight[key]};p.then(done,done);return p;
}
async function cached0(key,maxAgeH,loader,force){
  const c=store.get("c_"+key,null);
  if(!force&&c&&(Date.now()-c.at)<maxAgeH*3600e3)return c.v;
  try{const v=await loader();store.set("c_"+key,{at:Date.now(),v});mark(key,true);return v}
  catch(e){mark(key,false,e&&e.message);if(c)return c.v;throw e}
}

async function loadRT(codes){

  const keys=list.flatMap(c=>{const e=exOf(c);return e?[`${e}_${c}.tw`]:[`tse_${c}.tw`,`otc_${c}.tw`]});
  // 指數單獨一批，不會被其他股票的查詢錯誤拖累
  const batches=[["tse_t00.tw","otc_o00.tw"]];for(let i=0;i<keys.length;i+=40)batches.push(keys.slice(i,i+40));
  // 所有批次同時送出，不再一批等一批
  const t0=performance.now();

  let exNew=false;
  for(const rr of res){if(rr.status!=="fulfilled")continue;const j=rr.value;
    for(const m of j.msgArray||[]){
      if(m.c&&m.ex&&!exMap[m.c]){exMap[m.c]=m.ex;exNew=true}
      const y=num(m.y);let z=num(m.z);if(!isFinite(z))z=num(m.pz);
      const bp=split(m.b),bs=split(m.g),ap=split(m.a),as=split(m.f);
      if(!isFinite(z))z=bp[0]>0?bp[0]:y;
      const q={n:m.n,z,y,o:num(m.o),h:num(m.h),l:num(m.l),v:num(m.v),u:num(m.u),w:num(m.w),t:m.t,d:m.d,ch:z-y,pct:(z-y)/y*100,bp,bs,ap,as};
      if(m.c==="t00")idx.tse=q;else if(m.c==="o00")idx.otc=q;else rt[m.c]=q;
    }
  }
  rtInfo={at:tp().toISOString().slice(11,19),ms:Math.round(performance.now()-t0)};
  if(exNew)store.set("exMap",exMap);
  if(idx.tse&&isFinite(idx.tse.z)&&!idx.tse.stale)store.set("idxSnap",idx);
  mark("rt",true);
  // 存一份快照，下次打開 App 立刻顯示

}

async function loadHist(c,months,onPart){
  const t=tp();let y=t.getUTCFullYear(),m=t.getUTCMonth()+1;const list=[];
  for(let i=0;i<months;i++){list.push([y,m]);m--;if(!m){m=12;y--}}
  let all=[];
  for(const [yy,mm] of list){
    try{const r=await loadMonth(c,yy,mm);all=all.concat(r.bars);if(r.net){if(onPart)onPart(merge(all));await sleep(350)}}catch(e){await sleep(500)}
  }
  return merge(all);
  function merge(a){const mp={};for(const b of a)mp[b[0]]=b;return Object.values(mp).sort((x,y)=>x[0].localeCompare(y[0]))}
}
function aggregate(bars,mode){
  if(mode==="d")return bars;
  const out=[];let cur=null,key=null;
  for(const b of bars){
    let k;if(mode==="m")k=b[0].slice(0,7);else{const d=new Date(b[0]+"T00:00:00Z"),w=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-w);k=d.toISOString().slice(0,10)}
    if(k!==key){if(cur)out.push(cur);key=k;cur=[b[0],b[1],b[2],b[3],b[4],b[5]]}
    else{cur[0]=b[0];cur[2]=Math.max(cur[2],b[2]);cur[3]=Math.min(cur[3],b[3]);cur[4]=b[4];cur[5]+=b[5]}
  }
  if(cur)out.push(cur);return out;
}

// 手機系統字體放大時，App 的字也會被放大；量出放大倍數後抵銷，讓字體大小以 App 設定為準
let fontK=1;
function measureFontK(){try{const d=document.createElement("span");d.style.cssText="position:absolute;visibility:hidden;font-size:100px;line-height:1;white-space:nowrap";d.textContent="股股股股股股股股股股";document.body.appendChild(d);const w=d.getBoundingClientRect().width;d.remove();const k=w/1000;fontK=k>1.05&&k<4?k:1}catch(e){fontK=1}}
function applyS(){document.body.classList.toggle("swap",!!S.swap);const R=document.documentElement;R.classList.remove("fs-xs","fs-s","fs-l");if(S.fs!=="m")R.classList.add("fs-"+S.fs);
  R.style.fontSize="";R.style.removeProperty("--fs");measureFontK();
  if(fontK>1){const cs=getComputedStyle(R),base=parseFloat(cs.fontSize),fs=parseFloat(cs.getPropertyValue("--fs"));R.style.fontSize=(base/fontK).toFixed(2)+"px";if(fs)R.style.setProperty("--fs",(fs/fontK).toFixed(2)+"px")}}

  const lf=t.closest("[data-lbf]");if(lf){const k=lf.dataset.lbf,v=lf.dataset.v;LBF[k]=["mkt","sort"].includes(k)?v:+v;store.set("lbF",LBF);const el=ovKind?$("ovBody"):$("main"),sc=el.scrollTop;ovKind?renderOv():render();el.scrollTop=sc;return}

  const lg=t.closest("[data-lbgo]");if(lg){LBV=lg.dataset.lbgo;store.set("lbV",LBV);go("pick");return}
  if(t.closest("#tbAdd")){go("add");return}
  const kb=t.closest("[data-k]");if(kb){kMode=kb.dataset.k;store.set("kMode",kMode);document.querySelectorAll("#ktab button").forEach(b=>b.classList.toggle("on",b.dataset.k===kMode));drawK();ensureHist(ovArg);return}
  const ad=t.closest("[data-adel]");if(ad){alerts.splice(+ad.dataset.adel,1);saveA();ovKind==="stock"?renderStock():renderOv();return}

const REL="https://github.com/magic018076-code/stock-app/releases/download/latest/";
let myVer={code:0,name:"網頁版"},remoteVer=null;
async function getMyVer(){try{if(window.Capacitor&&Capacitor.Plugins.App){const i=await Capacitor.Plugins.App.getInfo();myVer={code:+i.build||0,name:i.version||""}}}catch(e){}if($("verDesc"))$("verDesc").textContent="目前版本 "+myVer.name}
async function checkUpdate(manual){
  await getMyVer();
  try{
    const r=await fetch(REL+"version.json?_="+Date.now());if(!r.ok)throw new Error("HTTP "+r.status);
    let j=await r.json();if(typeof j==="string")j=JSON.parse(j);remoteVer=j;
    const has=myVer.code&&j.versionCode>myVer.code;
    if($("verR"))$("verR").textContent=has?"有新版 "+j.versionName:"已是最新";
    if(has&&(manual||store.get("updSkip",0)!==j.versionCode)){$("updText").textContent=`App 有新版本 ${j.versionName}（需要重新安裝）`;$("updGo").textContent="下載";$("updGo").onclick=()=>{openUrl(REL+"stock-app.apk");toast("下載完成後點通知安裝")};$("updBar").classList.add("on")}
    else if(manual)toast(myVer.code?"已經是最新版本":"網頁版不需要更新");
  }catch(e){if(manual)toast("檢查更新失敗，請確認網路")}
}

let timer=null,rtBusy=false;

async function refreshRT(){

  const g=curGroup(),lb=lowbase?lbView():null;
  const codes=tab==="watch"?(g?g.codes:gSel==="h:"?Object.keys(holds):presetCodes(gSel).slice(0,40)):

    groups[0].codes.slice(0,8).concat(lb?lb.sig.slice(0,5).map(x=>x.c):[]);
  const all=codes.concat(ovKind==="stock"?[ovArg]:[],alerts.filter(a=>a.on).map(a=>a.c),Object.keys(holds));
  try{await loadRT(all)}catch(e){await sleep(1500);try{await loadRT(all)}catch(e2){mark("rt",false,e2&&e2.message)}}

function schedule(){clearInterval(timer);timer=setInterval(()=>{
  if(document.hidden||!S.auto)return;
  if(tab==="intl"){if(isNightOpen()||isTrading()||iSel.startsWith("us"))refreshIntl();return}
  if(!isTrading()&&!(idx.tse&&!idx.tse.stale)&&(tab==="home"||tab==="watch"||tab==="market")&&Date.now()-(window._idxTry||0)>60000){window._idxTry=Date.now();refreshRT()}
  if(isTrading()&&(tab==="watch"||tab==="home"||tab==="market"||tab==="pick"||ovKind==="stock"||alerts.some(a=>a.on)))refreshRT();
  if(tab==="home"&&isNightOpen())loadFutures().then(()=>{if(tab==="home"&&!ovKind)render()});
},S.int*1000)}
async function boot(force){
  // 先連即時報價和期貨（畫面最需要的），大型資料稍後再下載，避免搶頻寬
  const quick=Promise.allSettled([refreshRT(),refreshIntl()]);
  await Promise.race([quick,sleep(2500)]);
  await Promise.allSettled([
    quick,
    loadDaily(force).then(rerender),
    loadInfo(force).then(rerender),
    loadNews(force),
    loadMops(force),
    loadLowbase(force).then(()=>{if(tab==="pick"||tab==="home")refreshRT();if(ovKind==="lowbase")renderOv();else if(ovKind==="stock")renderStock();else if(!ovKind&&(tab==="pick"||tab==="home"||(tab==="watch"&&gSel==="p:low")))render()}),
    loadDaily(false).then(()=>Promise.all([loadFlows(force),loadInsti(force)])).then(rerender)
  ]);
  rerender();
}

// 清理舊版留在手機裡的逐月 K 線快取（現在改用 K 線檔），只留最近 120 筆
