<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>股市智多星</title>
<style>html,body{margin:0;height:100%;background:#000;color:#9aa0a8;font-family:sans-serif}#l{display:grid;place-items:center;height:100%;font-size:14px}</style>
</head>
<body>
<div id="l">載入中…</div>
<script>
/*
  介面自動更新（不用重新安裝 App）
  1. 先用手機裡已存好的最新介面（沒有的話用 App 內建的 app.html）立刻打開。
  2. 背景到 GitHub 檢查 ota.json；有新版就下載 app.html 存起來，下次打開自動套用，
     並在畫面上方提示「介面已更新」。
  3. 如果新介面打不開（8 秒內沒有回報正常），自動退回內建版本，並略過那個壞掉的版本。
*/
(function(){
  const RAW="https://raw.githubusercontent.com/magic018076-code/stock-app/main/www/";
  const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
  let cached=ls.get("ota_html"),cv=+(ls.get("ota_v")||0);
  // 上次用新介面啟動失敗 → 丟掉，改用內建
  if(cached&&ls.get("ota_booting")==="1"){ls.set("ota_bad",String(cv));ls.del("ota_html");ls.del("ota_v");cached=null;cv=0}
  async function bundled(){const r=await fetch("app.html");return r.text()}
  async function bundledV(){try{const r=await fetch("ota.json");return (await r.json()).v||0}catch(e){return 0}}
  function show(html,isOta){
    window.__OTA_V=isOta?cv:null;
    if(isOta){ls.set("ota_booting","1");setTimeout(()=>{if(!window.__appOK){ls.set("ota_bad",String(cv));ls.del("ota_html");ls.del("ota_v");ls.del("ota_booting");location.reload()}},8000)}
    document.open();document.write(html);document.close();
  }
  async function check(curV){
    try{
      const r=await fetch(RAW+"ota.json?t="+Date.now(),{headers:{"Cache-Control":"no-cache"}});if(!r.ok)return;
      let j=await r.json();if(typeof j==="string")j=JSON.parse(j);
      const v=+j.v||0;if(v<=curV||String(v)===ls.get("ota_bad"))return;
      const h=await fetch(RAW+"app.html?t="+Date.now(),{headers:{"Cache-Control":"no-cache"}});if(!h.ok)return;
      const html=await h.text();
      if(html.length<5000||html.indexOf("__appOK")<0)return; // 不完整的檔案不用
      ls.set("ota_html",html);ls.set("ota_v",String(v));
      window.__otaReady=v;if(typeof window.__onOtaReady==="function")window.__onOtaReady(v);
    }catch(e){}
  }
  (async()=>{
    const bv=await bundledV();
    // 內建版本比較新（例如剛裝了新 APK）時，用內建的
    if(cached&&cv>=bv)show(cached,true);
    else{if(cached&&cv<bv){ls.del("ota_html");ls.del("ota_v")}cv=bv;show(await bundled(),false)}
    setTimeout(()=>check(Math.max(cv,bv)),3000);
  })();
})();
</script>
</body>
</html>
